<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="640" viewBox="0 0 1240 640" role="img" aria-labelledby="title desc">
<title id="title">Retrieval is a component; the experiment is the purpose</title><desc id="desc">Agentic RAG can also use loops and tools. This comparison illustrates a basic retrieve-then-answer setup.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526582"/></marker></defs>
<rect width="1240" height="640" rx="18" fill="#F5F8FC"/>
<text x="36" y="43" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#172B4D" font-weight="700" text-anchor="start">Retrieval is a component; the experiment is the purpose</text>
<text x="36" y="73" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526582" font-weight="400" text-anchor="start">Agentic RAG can also use loops and tools. This comparison illustrates a basic retrieve-then-answer setup.</text>
<rect x="36" y="104" width="187" height="30" rx="15" fill="#EAF0FF"/>
<text x="129.5" y="124" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#245AE5" font-weight="700" text-anchor="middle">BASIC RAG PATTERN</text>
<rect x="36" y="150" width="200" height="100" rx="12" fill="white" stroke="#CFD9E6" stroke-width="1.3"/>
<rect x="36" y="165" width="4" height="70" rx="2" fill="#245AE5"/>
<text x="54" y="182" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#172B4D" font-weight="700" text-anchor="start">Question</text>
<rect x="285" y="150" width="250" height="100" rx="12" fill="white" stroke="#CFD9E6" stroke-width="1.3"/>
<rect x="285" y="165" width="4" height="70" rx="2" fill="#245AE5"/>
<text x="303" y="182" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#172B4D" font-weight="700" text-anchor="start">Retrieve passages</text>
<text x="303" y="211" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526582" font-weight="400" text-anchor="start">Keyword / vector / hybrid</text>
<rect x="584" y="150" width="280" height="100" rx="12" fill="white" stroke="#CFD9E6" stroke-width="1.3"/>
<rect x="584" y="165" width="4" height="70" rx="2" fill="#245AE5"/>
<text x="602" y="182" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#172B4D" font-weight="700" text-anchor="start">Generate answer</text>
<text x="602" y="211" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526582" font-weight="400" text-anchor="start">Use retrieved evidence</text>
<rect x="913" y="150" width="291" height="100" rx="12" fill="white" stroke="#CFD9E6" stroke-width="1.3"/>
<rect x="913" y="165" width="4" height="70" rx="2" fill="#245AE5"/>
<text x="931" y="182" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#172B4D" font-weight="700" text-anchor="start">Answer</text>
<text x="931" y="211" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526582" font-weight="400" text-anchor="start">Evaluate answer quality</text>
<path d="M 236 200 H 285" fill="none" stroke="#526582" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 535 200 H 584" fill="none" stroke="#526582" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 864 200 H 913" fill="none" stroke="#526582" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="36" y="297" width="235" height="30" rx="15" fill="#E5F4F0"/>
<text x="153.5" y="317" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#007F73" font-weight="700" text-anchor="middle">THIS TESTING HARNESS</text>
<rect x="36" y="350" width="250" height="142" rx="12" fill="white" stroke="#CFD9E6" stroke-width="1.3"/>
<rect x="36" y="365" width="4" height="112" rx="2" fill="#007F73"/>
<text x="54" y="382" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#172B4D" font-weight="700" text-anchor="start">Experiment definition</text>
<text x="54" y="411" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526582" font-weight="400" text-anchor="start">Question set + conditions</text>
<text x="54" y="434" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526582" font-weight="400" text-anchor="start">Fixed model and settings</text>
<text x="54" y="457" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526582" font-weight="400" text-anchor="start">Frozen seed + shared cache</text>
<rect x="339" y="350" width="265" height="142" rx="12" fill="#EAF0FF" stroke="#CFD9E6" stroke-width="1.3"/>
<rect x="339" y="365" width="4" height="112" rx="2" fill="#245AE5"/>
<text x="357" y="382" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#172B4D" font-weight="700" text-anchor="start">Choose next action</text>
<text x="357" y="411" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526582" font-weight="400" text-anchor="start">Search, open, click or find</text>
<text x="357" y="434" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526582" font-weight="400" text-anchor="start">Or finish the answer</text>
<rect x="657" y="350" width="260" height="142" rx="12" fill="white" stroke="#CFD9E6" stroke-width="1.3"/>
<rect x="657" y="365" width="4" height="112" rx="2" fill="#007F73"/>
<text x="675" y="382" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#172B4D" font-weight="700" text-anchor="start">Controlled evidence</text>
<text x="675" y="411" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526582" font-weight="400" text-anchor="start">Resolve page version</text>
<text x="675" y="434" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526582" font-weight="400" text-anchor="start">Return text and links</text>
<rect x="970" y="350" width="234" height="142" rx="12" fill="white" stroke="#CFD9E6" stroke-width="1.3"/>
<rect x="970" y="365" width="4" height="112" rx="2" fill="#245AE5"/>
<text x="988" y="382" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#172B4D" font-weight="700" text-anchor="start">Measurements</text>
<text x="988" y="411" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526582" font-weight="400" text-anchor="start">Search / open behavior</text>
<text x="988" y="434" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526582" font-weight="400" text-anchor="start">Mentions + citations</text>
<text x="988" y="457" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526582" font-weight="400" text-anchor="start">Correct award use</text>
<path d="M 286 411 H 339" fill="none" stroke="#526582" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 604 396 H 657" fill="none" stroke="#526582" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 788 492 V 540 H 471 V 492" fill="none" stroke="#526582" stroke-width="2" marker-end="url(#arrow)"/>
<text x="630" y="564" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#007F73" font-weight="700" text-anchor="middle">Observe evidence → choose again</text>
<path d="M 604 371 H 625 V 320 H 948 V 411 H 970" fill="none" stroke="#526582" stroke-width="2" marker-end="url(#arrow)"/>
<text x="792" y="308" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#526582" font-weight="400" text-anchor="middle">Final answer and recorded actions</text>
<text x="36" y="614" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#172B4D" font-weight="700" text-anchor="start">The distinction is experimental control and measurement, not “RAG cannot be agentic.”</text>
</svg>
