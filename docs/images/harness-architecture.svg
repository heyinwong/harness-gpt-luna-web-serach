<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="650" viewBox="0 0 1240 650" role="img" aria-labelledby="title desc">
<title id="title">A controlled environment for a searching agent</title><desc id="desc">The model chooses its next action. The harness controls the evidence returned by that action.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526582"/></marker></defs>
<rect width="1240" height="650" rx="18" fill="#F5F8FC"/>
<text x="36" y="43" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#172B4D" font-weight="700" text-anchor="start">A controlled environment for a searching agent</text>
<text x="36" y="73" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526582" font-weight="400" text-anchor="start">The model chooses its next action. The harness controls the evidence returned by that action.</text>
<rect x="36" y="216" width="205" height="116" rx="12" fill="white" stroke="#CFD9E6" stroke-width="1.3"/>
<rect x="36" y="231" width="4" height="86" rx="2" fill="#245AE5"/>
<text x="54" y="248" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#172B4D" font-weight="700" text-anchor="start">Question</text>
<text x="54" y="277" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526582" font-weight="400" text-anchor="start">Same instructions</text>
<text x="54" y="300" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526582" font-weight="400" text-anchor="start">Fresh run state</text>
<rect x="293" y="191" width="250" height="170" rx="12" fill="#EAF0FF" stroke="#CFD9E6" stroke-width="1.3"/>
<rect x="293" y="206" width="4" height="140" rx="2" fill="#245AE5"/>
<text x="311" y="223" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#172B4D" font-weight="700" text-anchor="start">GPT-5.6 Luna</text>
<text x="311" y="252" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526582" font-weight="400" text-anchor="start">Choose queries and actions</text>
<text x="311" y="275" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526582" font-weight="400" text-anchor="start">Read returned evidence</text>
<text x="311" y="298" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526582" font-weight="400" text-anchor="start">Decide when to answer</text>
<rect x="595" y="191" width="214" height="170" rx="12" fill="white" stroke="#CFD9E6" stroke-width="1.3"/>
<rect x="595" y="206" width="4" height="140" rx="2" fill="#245AE5"/>
<text x="613" y="223" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#172B4D" font-weight="700" text-anchor="start">Custom tools</text>
<text x="613" y="252" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526582" font-weight="400" text-anchor="start">search  ·  open</text>
<text x="613" y="275" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526582" font-weight="400" text-anchor="start">click  ·  find</text>
<text x="613" y="298" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526582" font-weight="400" text-anchor="start">Log each tool result</text>
<rect x="868" y="122" width="336" height="102" rx="12" fill="white" stroke="#CFD9E6" stroke-width="1.3"/>
<rect x="868" y="137" width="4" height="72" rx="2" fill="#007F73"/>
<text x="886" y="154" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#172B4D" font-weight="700" text-anchor="start">Search index</text>
<text x="886" y="183" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526582" font-weight="400" text-anchor="start">Frozen pages → ranked passages</text>
<rect x="868" y="251" width="336" height="102" rx="12" fill="white" stroke="#CFD9E6" stroke-width="1.3"/>
<rect x="868" y="266" width="4" height="72" rx="2" fill="#007F73"/>
<text x="886" y="283" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#172B4D" font-weight="700" text-anchor="start">Page resolver</text>
<text x="886" y="312" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526582" font-weight="400" text-anchor="start">Condition → seed → cache / fetch</text>
<path d="M 241 272 H 293" fill="none" stroke="#526582" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 543 249 H 595" fill="none" stroke="#526582" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 809 239 H 840 V 173 H 868" fill="none" stroke="#526582" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 809 306 H 868" fill="none" stroke="#526582" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 973 353 V 405 H 420 V 361" fill="none" stroke="#526582" stroke-width="2" marker-end="url(#arrow)"/>
<text x="674" y="396" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#007F73" font-weight="700" text-anchor="middle">Passages, links and page text</text>
<path d="M 417 191 V 140" fill="none" stroke="#526582" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="293" y="100" width="250" height="40" rx="12" fill="white" stroke="#CFD9E6" stroke-width="1.3"/>
<rect x="293" y="115" width="4" height="10" rx="2" fill="#245AE5"/>
<text x="311" y="132" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#172B4D" font-weight="700" text-anchor="start">Final answer</text>
<path d="M 1204 173 H 1220 V 405 H 973" fill="none" stroke="#526582" stroke-width="2"/>
<rect x="36" y="468" width="1168" height="117" rx="12" fill="#EDF3FA" stroke="#CFD9E6" stroke-width="1.3"/>
<rect x="36" y="483" width="4" height="87" rx="2" fill="#245AE5"/>
<text x="54" y="500" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#172B4D" font-weight="700" text-anchor="start">Experiment record</text>
<text x="54" y="529" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526582" font-weight="400" text-anchor="start">Question + condition + model settings + source hashes + actions + answer</text>
<text x="54" y="552" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526582" font-weight="400" text-anchor="start">Compare behavior with hosted search; score award use within the controlled conditions.</text>
<path d="M 809 345 H 835 V 468" fill="none" stroke="#526582" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<rect x="868" y="93" width="238" height="30" rx="15" fill="#E5F4F0"/>
<text x="987.0" y="113" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#007F73" font-weight="700" text-anchor="middle">Controlled evidence boundary</text>
<text x="36" y="625" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526582" font-weight="400" text-anchor="start">Newly fetched pages stay outside the search index. Background responses are shared across conditions.</text>
</svg>
