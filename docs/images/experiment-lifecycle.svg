<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="655" viewBox="0 0 1240 655" role="img" aria-labelledby="title desc">
<title id="title">Two questions, two evaluation tracks</title><desc id="desc">Does the harness resemble hosted search? What does changing the award placement do inside the harness?</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526582"/></marker></defs>
<rect width="1240" height="655" rx="18" fill="#F5F8FC"/>
<text x="36" y="43" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#172B4D" font-weight="700" text-anchor="start">Two questions, two evaluation tracks</text>
<text x="36" y="73" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526582" font-weight="400" text-anchor="start">Does the harness resemble hosted search? What does changing the award placement do inside the harness?</text>
<rect x="36" y="123" width="285" height="148" rx="12" fill="white" stroke="#CFD9E6" stroke-width="1.3"/>
<rect x="36" y="138" width="4" height="118" rx="2" fill="#245AE5"/>
<text x="54" y="155" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#172B4D" font-weight="700" text-anchor="start">1  Capture and freeze</text>
<text x="54" y="184" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526582" font-weight="400" text-anchor="start">Bank + competitor pages</text>
<text x="54" y="207" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526582" font-weight="400" text-anchor="start">Questions, settings and code</text>
<text x="54" y="230" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526582" font-weight="400" text-anchor="start">Timestamps and source hashes</text>
<rect x="388" y="123" width="346" height="148" rx="12" fill="#EAF0FF" stroke="#CFD9E6" stroke-width="1.3"/>
<rect x="388" y="138" width="4" height="118" rx="2" fill="#245AE5"/>
<text x="406" y="155" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#172B4D" font-weight="700" text-anchor="start">2  Compare search behavior</text>
<text x="406" y="184" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526582" font-weight="400" text-anchor="start">Unmodified pages in the harness</text>
<text x="406" y="207" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526582" font-weight="400" text-anchor="start">Same questions with hosted search</text>
<text x="406" y="230" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526582" font-weight="400" text-anchor="start">Means, distributions and failures</text>
<rect x="801" y="123" width="403" height="148" rx="12" fill="#FFF4DF" stroke="#CFD9E6" stroke-width="1.3"/>
<rect x="801" y="138" width="4" height="118" rx="2" fill="#A55B00"/>
<text x="819" y="155" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#172B4D" font-weight="700" text-anchor="start">3  Record the fidelity verdict</text>
<text x="819" y="184" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526582" font-weight="400" text-anchor="start">Pass, difference or inconclusive</text>
<text x="819" y="207" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526582" font-weight="400" text-anchor="start">Keep remaining gaps visible</text>
<text x="819" y="230" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526582" font-weight="400" text-anchor="start">Do not tune against award outcomes</text>
<path d="M 321 195 H 388" fill="none" stroke="#526582" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 734 195 H 801" fill="none" stroke="#526582" stroke-width="2" marker-end="url(#arrow)"/>
<text x="36" y="329" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#007F73" font-weight="700" text-anchor="start">SEPARATE TREATMENT TRACK</text>
<rect x="36" y="355" width="698" height="166" rx="12" fill="white" stroke="#CFD9E6" stroke-width="1.3"/>
<rect x="36" y="370" width="4" height="136" rx="2" fill="#007F73"/>
<text x="54" y="387" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#172B4D" font-weight="700" text-anchor="start">4  Run the six predefined page conditions</text>
<text x="54" y="416" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526582" font-weight="400" text-anchor="start">Baseline · inline · hub without link</text>
<text x="54" y="439" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526582" font-weight="400" text-anchor="start">Vague link · descriptive claim + link · current footnote</text>
<text x="54" y="462" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526582" font-weight="400" text-anchor="start">Fresh model state per run; randomized order; one shared cache</text>
<rect x="801" y="355" width="403" height="166" rx="12" fill="white" stroke="#CFD9E6" stroke-width="1.3"/>
<rect x="801" y="370" width="4" height="136" rx="2" fill="#007F73"/>
<text x="819" y="387" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#172B4D" font-weight="700" text-anchor="start">5  Score effects and uncertainty</text>
<text x="819" y="416" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526582" font-weight="400" text-anchor="start">Exposure → navigation → award use</text>
<text x="819" y="439" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526582" font-weight="400" text-anchor="start">Review identity and product relevance</text>
<text x="819" y="462" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526582" font-weight="400" text-anchor="start">Preserve failed or incomplete runs</text>
<path d="M 321 243 H 353 V 355" fill="none" stroke="#526582" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<path d="M 734 437 H 801" fill="none" stroke="#526582" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="36" y="556" width="1168" height="66" rx="12" fill="#FFF4DF" stroke="#CFD9E6" stroke-width="1.3"/>
<rect x="36" y="571" width="4" height="36" rx="2" fill="#A55B00"/>
<text x="54" y="588" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#172B4D" font-weight="700" text-anchor="start">Transfer to hosted Luna requires supporting fidelity evidence.</text>
<text x="55" y="609" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526582" font-weight="400" text-anchor="start">The award study can estimate effects within this harness even while transfer remains unestablished.</text>
</svg>
